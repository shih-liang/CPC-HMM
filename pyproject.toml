[tool.ruff]
# Syntax target only; the recorded test runtime is Python 3.14.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821", "F822", "F823", "F811", "D100", "D209"]
# Numerical scripts set BLAS/backend options before importing array/plot libraries.
# Short mathematical indices remain unchanged to preserve equation correspondence.
ignore = ["E402", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
